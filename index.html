<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day of the Dogs - Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🐕 Day of the Dogs 🐕</h1>
        
        <div class="scene">
            <!-- Sun -->
            <div class="sun"></div>
            
            <!-- Clouds -->
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
            
            <!-- Dogs -->
            <div class="dog dog1">
                <div class="dog-body">
                    <div class="dog-head">
                        <div class="ear ear-left"></div>
                        <div class="ear ear-right"></div>
                        <div class="eye eye-left"></div>
                        <div class="eye eye-right"></div>
                        <div class="nose"></div>
                        <div class="mouth"></div>
                    </div>
                    <div class="dog-torso"></div>
                    <div class="leg leg1"></div>
                    <div class="leg leg2"></div>
                    <div class="leg leg3"></div>
                    <div class="leg leg4"></div>
                    <div class="tail"></div>
                </div>
            </div>
            
            <div class="dog dog2">
                <div class="dog-body">
                    <div class="dog-head">
                        <div class="ear ear-left"></div>
                        <div class="ear ear-right"></div>
                        <div class="eye eye-left"></div>
                        <div class="eye eye-right"></div>
                        <div class="nose"></div>
                        <div class="mouth"></div>
                    </div>
                    <div class="dog-torso"></div>
                    <div class="leg leg1"></div>
                    <div class="leg leg2"></div>
                    <div class="leg leg3"></div>
                    <div class="leg leg4"></div>
                    <div class="tail"></div>
                </div>
            </div>
            
            <!-- Bones floating around -->
            <div class="bone bone1">🦴</div>
            <div class="bone bone2">🦴</div>
            <div class="bone bone3">🦴</div>
            
            <!-- Paw prints -->
            <div class="paw-print paw1">🐾</div>
            <div class="paw-print paw2">🐾</div>
            <div class="paw-print paw3">🐾</div>
            <div class="paw-print paw4">🐾</div>
            
            <!-- Ground -->
            <div class="ground"></div>
        </div>
        
        <p class="subtitle">Watch the dogs play! 🎉</p>
    </div>
</body>
</html>
